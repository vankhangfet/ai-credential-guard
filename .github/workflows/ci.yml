name: CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
on:
  push: { branches: [main] }
  pull_request:

jobs:
  node:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: dist/rules.json artifact tồn tại và đủ rules
        # floor 49 — bump khi chỉnh catalog
        run: node -e "const r=require('./dist/rules.json'); if(!Array.isArray(r)||r.length<49) process.exit(1); console.log('rules:',r.length)"
        shell: bash
      - name: bin shebang guard
        run: head -1 dist/cli.js | grep -q '#!'
        shell: bash

  python:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m unittest discover -s fallback/tests -t . -v

  installers:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash -n fallback/install.sh
        if: runner.os == 'Linux'
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: npm ci && npm run build
      - name: copy rules artifact cho installer
        run: cp dist/rules.json fallback/rules.json
        shell: bash
      - name: installer smoke (bash, python3 từ setup-python)
        if: runner.os == 'Linux'
        run: |
          TMP=$(mktemp -d) && mkdir -p "$TMP/.claude" "$TMP/.codex" "$TMP/.ai-guard"
          printf '{}' > "$TMP/.claude/settings.json"
          printf '{"hooks":{}}' > "$TMP/.codex/hooks.json"
          cd "$TMP" && bash "$GITHUB_WORKSPACE/fallback/install.sh"
          grep -q "check-prompt" "$TMP/.claude/settings.json"
          grep -q "check-file" "$TMP/.codex/hooks.json"
          # engine-exec: khóa registered path + rules artifact chạy thật (bug class của 2a18be3)
          echo 'test sạch' | python3 "$TMP/.ai-guard/bin/engine.py" check-prompt --root "$TMP"
          echo "INSTALLER_SMOKE_OK"
      - name: installer smoke (powershell, mirror của bash smoke)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmp = Join-Path ([IO.Path]::GetTempPath()) ("aig-smoke-" + [GUID]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path "$tmp\.claude", "$tmp\.codex", "$tmp\.ai-guard" | Out-Null
          Set-Content -Path "$tmp\.claude\settings.json" -Value "{}"
          Set-Content -Path "$tmp\.codex\hooks.json" -Value '{"hooks":{}}'
          Push-Location $tmp
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\fallback\install.ps1"
          Pop-Location
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exit $LASTEXITCODE" }
          if (-not (Select-String -Path "$tmp\.claude\settings.json" -Pattern "check-prompt" -Quiet)) { throw "thiếu check-prompt trong settings.json" }
          if (-not (Select-String -Path "$tmp\.codex\hooks.json" -Pattern "check-file" -Quiet)) { throw "thiếu check-file trong hooks.json" }
          # engine-exec mirror: khóa registered path + rules artifact chạy thật
          "test sạch" | python "$tmp\.ai-guard\bin\engine.py" check-prompt --root "$tmp"
          if ($LASTEXITCODE -ne 0) { throw "engine check-prompt exit $LASTEXITCODE" }
          Write-Host "INSTALLER_SMOKE_OK"
